version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kach-inn-db
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: kach_inn
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kach-net

  backend:
    build:
      context: ./backend
    container_name: kach-inn-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: my-secret-pw
      DB_NAME: kach_inn
      JWT_SECRET: superstrongproductionsecret1234567890
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - kach-net

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: kach-inn-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - kach-net

volumes:
  db_data:

networks:
  kach-net:
